<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nirikshan — Student Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="portal-page">
  <div class="shell">
    <div class="card">
      <div class="brand">
        <div class="dot"></div>
        <div>
          <div class="title">NIRIKSHAN Student</div>
          <div class="subtitle">Attendance report portal</div>
        </div>
      </div>

      <div id="loginView">
        <div class="form">
          <div class="field"><input id="studentIdInput" type="text" placeholder="Enter your student ID" /></div>
          <div class="field"><input id="studentPasswordInput" type="password" placeholder="Enter your password" /></div>
          <button id="loginBtn">Login</button>
          <div class="hint" id="loginHint"></div>
        </div>
      </div>

      <div id="reportView" style="display:none;">
        <div class="profile-card">
          <img id="studentAvatar" class="student-avatar" alt="Student Photo" style="display:none;" />
          <div>
            <div class="student-name" id="studentName"></div>
            <div class="student-id" id="studentMeta"></div>
          </div>
        </div>
        <div class="grid">
          <div class="panel">
            <div class="stats">
              <div class="stat"><div class="value" id="totalPresent">0</div><div class="label">Present Days</div></div>
              <div class="stat"><div class="value" id="currentStreak">0</div><div class="label">Current Streak</div></div>
            </div>
            <div class="chart" id="chart"></div>
          </div>
          <div class="panel">
            <h3 style="margin-top:0; font-family:var(--display); letter-spacing:1px; text-transform:uppercase;">Attendance Summary</h3>
            <div id="recentList" class="meta"></div>
            <div style="margin-top:12px;"><button id="logoutBtn">Logout</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
    const STUDENT_AUTH_KEY = 'sentryStudentAuth';
    const ATTENDANCE_KEY = 'sentryStudentAttendance';

    const loginView = document.getElementById('loginView');
    const reportView = document.getElementById('reportView');
    const studentIdInput = document.getElementById('studentIdInput');
    const studentPasswordInput = document.getElementById('studentPasswordInput');
    const loginHint = document.getElementById('loginHint');
    const chartEl = document.getElementById('chart');
    const totalPresentEl = document.getElementById('totalPresent');
    const currentStreakEl = document.getElementById('currentStreak');
    const studentMetaEl = document.getElementById('studentMeta');
    const studentNameEl = document.getElementById('studentName');
    const studentAvatarEl = document.getElementById('studentAvatar');
    const recentListEl = document.getElementById('recentList');

    function loadAttendance() {
      try {
        const raw = localStorage.getItem(ATTENDANCE_KEY);
        if (!raw) return [];
        return JSON.parse(raw);
      } catch (err) {
        return [];
      }
    }

    async function verifySession() {
      const token = localStorage.getItem('sentryAuthToken');
      if (!token) return null;
      try {
        const response = await fetch(`${API_BASE}/api/auth/verify`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await response.json();
        if (!response.ok || !data.user) return null;
        return data.user;
      } catch (error) {
        return null;
      }
    }

    function renderReport(student) {
      const records = loadAttendance().filter(entry => String(entry.studentId) === String(student.studentId));
      const labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const counts = Array(7).fill(0);

      records.forEach(entry => {
        const date = new Date(entry.date || entry.createdAt || new Date());
        const index = (date.getDay() + 6) % 7;
        counts[index] += 1;
      });

      const max = Math.max(1, ...counts);
      chartEl.innerHTML = counts.map((value, index) => `
        <div class="bar-wrap">
          <div class="bar" style="height:${Math.max(18, (value / max) * 140)}px;"><span></span></div>
          <div class="bar-label">${labels[index]}</div>
        </div>
      `).join('');

      const totalPresent = records.length;
      let streak = 0;
      const today = new Date();
      for (let offset = 0; offset < 30; offset += 1) {
        const day = new Date(today);
        day.setDate(today.getDate() - offset);
        const dayKey = day.toISOString().slice(0, 10);
        const hasRecord = records.some(entry => (entry.date || entry.createdAt || '').slice(0, 10) === dayKey);
        if (hasRecord) streak += 1; else break;
      }

      totalPresentEl.textContent = totalPresent;
      currentStreakEl.textContent = streak;
      studentNameEl.textContent = student.name;
      studentMetaEl.textContent = `ID ${student.studentId}`;
      if (student.photoDataUrl) {
        studentAvatarEl.src = student.photoDataUrl;
        studentAvatarEl.style.display = 'block';
      } else {
        studentAvatarEl.style.display = 'none';
      }

      if (records.length === 0) {
        recentListEl.innerHTML = '<div>No attendance records yet.</div>';
      } else {
        recentListEl.innerHTML = records.slice(0, 6).map(entry => `
          <div style="margin-bottom:6px;">${escapeHtml(entry.date || entry.createdAt || 'Unknown')} · ${entry.present ? 'Present' : 'Absent'}</div>
        `).join('');
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showDashboard(student) {
      loginView.style.display = 'none';
      reportView.style.display = 'block';
      renderReport(student);
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const studentId = studentIdInput.value.trim();
      const password = studentPasswordInput.value;
      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, password, role: 'student' })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Invalid student ID or password.');
        localStorage.setItem('sentryAuthToken', data.token);
        localStorage.setItem(STUDENT_AUTH_KEY, studentId);
        loginHint.textContent = '';
        showDashboard(data.user);
      } catch (error) {
        loginHint.textContent = error.message || 'Invalid student ID or password.';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      const token = localStorage.getItem('sentryAuthToken');
      if (token) {
        await fetch(`${API_BASE}/api/auth/logout`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
      }
      localStorage.removeItem(STUDENT_AUTH_KEY);
      localStorage.removeItem('sentryAuthToken');
      reportView.style.display = 'none';
      loginView.style.display = 'block';
      studentIdInput.value = '';
      studentPasswordInput.value = '';
      loginHint.textContent = '';
    });

    (async function init() {
      const currentUser = await verifySession();
      if (currentUser && currentUser.role === 'student') {
        showDashboard(currentUser);
      }
    })();

    setInterval(async () => {
      const activeStudentId = localStorage.getItem(STUDENT_AUTH_KEY);
      if (activeStudentId && reportView.style.display !== 'none') {
        const user = await verifySession();
        if (user && user.role === 'student') {
          renderReport(user);
        }
      }
    }, 3000);
  </script>
</body>
</html>
