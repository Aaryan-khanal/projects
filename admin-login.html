<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nirikshan — Admin Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <div class="card">
    <div class="brand">
      <div class="dot"></div>
      <div>
        <div class="title">NIRIKSHAN Admin</div>
        <div class="subtitle">Secure access</div>
      </div>
    </div>

    <div class="switcher">
      <button id="adminModeBtn" class="active" type="button">Admin</button>
      <button id="superAdminModeBtn" type="button">Super Admin</button>
    </div>
    <div class="field">
      <label for="username">Email</label>
      <input id="username" type="text" placeholder="Enter email" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password" />
    </div>
    <button id="loginBtn">Login</button>
    <div style="margin-top:10px; text-align:center;">
      <a href="super-admin.html" style="color:var(--amber); font-family:var(--mono); font-size:11px; text-decoration:none;">Open Super Admin</a>
      <br />
      <a href="student-login.html" style="color:var(--amber); font-family:var(--mono); font-size:11px; text-decoration:none;">Open Student Portal</a>
    </div>
    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const adminModeBtn = document.getElementById('adminModeBtn');
    const superAdminModeBtn = document.getElementById('superAdminModeBtn');
    let mode = 'admin';

    function setMode(nextMode) {
      mode = nextMode;
      adminModeBtn.classList.toggle('active', nextMode === 'admin');
      superAdminModeBtn.classList.toggle('active', nextMode === 'super');
      document.querySelector('.title').textContent = nextMode === 'super' ? 'NIRIKSHAN SUPER ADMIN' : 'NIRIKSHAN ADMIN';
      document.querySelector('.subtitle').textContent = nextMode === 'super' ? 'Secure super access' : 'Secure access';
    }

    function persistSession(token, user) {
      localStorage.setItem('sentryAuthToken', token);
      localStorage.setItem('sentryUserRole', user.role);
      localStorage.setItem('sentryUserEmail', user.email || '');
      localStorage.setItem('sentryAdminAuth', user.role === 'super_admin' || user.role === 'admin' ? 'true' : 'false');
      localStorage.setItem('sentryTeacherAuth', user.role === 'teacher' ? 'true' : 'false');
      localStorage.setItem('sentrySuperAdminAuth', user.role === 'super_admin' ? 'true' : 'false');
    }

    async function authenticateUser(email, password) {
      const response = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, role: mode === 'super' ? 'superadmin' : 'admin' })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Login failed');
      return data;
    }

    adminModeBtn.addEventListener('click', () => setMode('admin'));
    superAdminModeBtn.addEventListener('click', () => setMode('super'));

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = usernameInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        errorMsg.textContent = 'Please enter your email and password.';
        return;
      }

      try {
        const result = await authenticateUser(email, password);
        persistSession(result.token, result.user);
        if (result.user.role === 'super_admin') {
          window.location.href = 'super-admin.html';
        } else {
          window.location.href = 'admin.html';
        }
      } catch (err) {
        errorMsg.textContent = err.message || 'Failed to sign in';
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        document.getElementById('loginBtn').click();
      }
    });
  </script>
</body>
</html>
