<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nirikshan — Student Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="card student-login-card">
      <div class="title">NIRIKSHAN Student</div>
      <div class="subtitle">Personal attendance portal</div>
      <div class="field"><input id="studentIdInput" type="text" placeholder="Student ID" /></div>
      <div class="field"><input id="studentPasswordInput" type="password" placeholder="Password" /></div>
      <button id="loginBtn">Open Report</button>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
    const STUDENT_AUTH_KEY = 'sentryStudentAuth';
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const id = document.getElementById('studentIdInput').value.trim();
      const password = document.getElementById('studentPasswordInput').value;
      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId: id, password, role: 'student' })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('sentryAuthToken', data.token);
        localStorage.setItem(STUDENT_AUTH_KEY, id);
        window.location.href = 'student-portal.html';
      } catch (err) {
        document.getElementById('hint').textContent = err.message || 'Invalid student ID or password.';
      }
    });
  </script>
</body>
</html>
