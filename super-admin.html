<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nirikshan — Super Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="dot"></div>
        <div>
          <div class="title">NIRIKSHAN Super Admin</div>
          <div class="subtitle">Full control center</div>
        </div>
      </div>
      <div class="nav">
        <a href="admin.html">Admin Panel</a>
        <a href="attendance.html">Attendance</a>
        <a href="admin-login.html" id="logoutLink">Logout</a>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Register People</h2>
        <div class="form">
          <input id="personName" type="text" placeholder="Name" />
          <input id="personEmail" type="text" placeholder="Email" />
          <input id="studentIdInput" type="text" placeholder="ID" />
          <input id="studentPasswordInput" type="password" placeholder="Password" />
          <select id="personRole">
            <option value="teacher">Teacher</option>
            <option value="student">Student</option>
          </select>
          <div class="row-actions">
            <button id="registerBtn">Register</button>
            <button id="resetPeopleBtn">Reset All</button>
          </div>
        </div>
        <div class="stats" style="margin-top:12px;">
          <div class="stat"><div class="value" id="teacherCount">0</div><div class="label">Teachers</div></div>
          <div class="stat"><div class="value" id="studentCount">0</div><div class="label">Students</div></div>
        </div>
      </div>

      <div class="card">
        <h2>Managed Accounts</h2>
        <div class="list" id="peopleList"><div class="empty">No users registered yet.</div></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
    const AUTH_KEY = 'sentryAdminAuth';
    const SUPER_AUTH_KEY = 'sentrySuperAdminAuth';
    const TEACHER_AUTH_KEY = 'sentryTeacherAuth';

    async function requireAuth() {
      const token = localStorage.getItem('sentryAuthToken');
      if (!token) {
        window.location.href = 'admin-login.html';
        return;
      }
      try {
        const response = await fetch(`${API_BASE}/api/auth/verify`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await response.json();
        if (!response.ok || !data.user || data.user.role !== 'super_admin') {
          window.location.href = 'admin-login.html';
          return;
        }
        localStorage.setItem(AUTH_KEY, 'true');
        localStorage.setItem(TEACHER_AUTH_KEY, 'false');
        localStorage.setItem(SUPER_AUTH_KEY, 'true');
      } catch (error) {
        window.location.href = 'admin-login.html';
      }
    }

    void requireAuth();

    document.getElementById('logoutLink').addEventListener('click', async () => {
      const token = localStorage.getItem('sentryAuthToken');
      if (token) {
        await fetch(`${API_BASE}/api/auth/logout`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
      }
      localStorage.removeItem(AUTH_KEY);
      localStorage.removeItem(TEACHER_AUTH_KEY);
      localStorage.removeItem(SUPER_AUTH_KEY);
      localStorage.removeItem('sentryAuthToken');
      localStorage.removeItem('sentryUserRole');
      localStorage.removeItem('sentryUserEmail');
    });

    const nameInput = document.getElementById('personName');
    const emailInput = document.getElementById('personEmail');
    const studentIdInput = document.getElementById('studentIdInput');
    const studentPasswordInput = document.getElementById('studentPasswordInput');
    const roleSelect = document.getElementById('personRole');
    const peopleList = document.getElementById('peopleList');
    const teacherCountEl = document.getElementById('teacherCount');
    const studentCountEl = document.getElementById('studentCount');

    async function loadPeople() {
      const token = localStorage.getItem('sentryAuthToken');
      const response = await fetch(`${API_BASE}/api/users`, { headers: { Authorization: `Bearer ${token}` } });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Unable to load users');
      return data;
    }

    async function renderPeople() {
      try {
        const people = (await loadPeople()).filter(p => p.role === 'teacher' || p.role === 'student');
        teacherCountEl.textContent = people.filter(p => p.role === 'teacher').length;
        studentCountEl.textContent = people.filter(p => p.role === 'student').length;

        if (people.length === 0) {
          peopleList.innerHTML = '<div class="empty">No users registered yet.</div>';
          return;
        }

        peopleList.innerHTML = people.map(person => `
          <div class="item">
            <div>
              <div class="name">${escapeHtml(person.name)}</div>
              <div class="meta">${escapeHtml(person.email || '')} · ${escapeHtml(person.role)}${person.role === 'student' && person.studentId ? ` · ID ${escapeHtml(person.studentId)}` : ''}</div>
            </div>
            <div class="row-actions">
              <div class="pill ${person.role === 'teacher' ? '' : 'warn'}">${person.role === 'teacher' ? 'Teacher' : 'Student'}</div>
              <button class="danger" data-action="remove" data-id="${person.id}">Remove</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        peopleList.innerHTML = `<div class="empty">${escapeHtml(error.message || 'Could not load users')}</div>`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('registerBtn').addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const role = roleSelect.value;
      const studentId = studentIdInput.value.trim();
      const password = studentPasswordInput.value;
      if (!name || !email || !password) return;
      if (role === 'student' && !studentId) return;

      const token = localStorage.getItem('sentryAuthToken');
      const response = await fetch(`${API_BASE}/api/users`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ name, email, password, role, studentId })
      });
      const data = await response.json();
      if (!response.ok) {
        alert(data.error || 'Unable to create user');
        return;
      }
      nameInput.value = '';
      emailInput.value = '';
      studentIdInput.value = '';
      studentPasswordInput.value = '';
      roleSelect.value = 'teacher';
      await renderPeople();
    });

    peopleList.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const id = button.dataset.id;
      if (button.dataset.action === 'remove') {
        const token = localStorage.getItem('sentryAuthToken');
        const response = await fetch(`${API_BASE}/api/users/${id}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await response.json();
        if (!response.ok) {
          alert(data.error || 'Unable to delete user');
          return;
        }
        await renderPeople();
      }
    });

    document.getElementById('resetPeopleBtn').addEventListener('click', async () => {
      if (!confirm('Reset all registered teachers and students?')) return;
      try {
        const token = localStorage.getItem('sentryAuthToken');
        const response = await fetch(`${API_BASE}/api/users`, { headers: { Authorization: `Bearer ${token}` } });
        const users = await response.json();
        const manualUsers = users.filter(user => user.role === 'teacher' || user.role === 'student');
        for (const user of manualUsers) {
          await fetch(`${API_BASE}/api/users/${user.id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
        }
        await renderPeople();
      } catch (error) {
        alert(error.message || 'Unable to reset users');
      }
    });

    void renderPeople();
  </script>
</body>
</html>
